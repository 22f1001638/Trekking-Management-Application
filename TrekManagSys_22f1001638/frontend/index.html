<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trek Management</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3"></script>
    <!-- Axios (HTTP client) -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>

    <div id="app" class="container py-4">

        <!-- ========================================================= -->
        <!--  LOGIN / REGISTER (shown when loggedIn === false)          -->
        <!-- ========================================================= -->
        <div v-if="!loggedIn" class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <!-- Login -->
                <div v-if="!showRegister" class="border rounded p-4">
                    <h4 class="mb-1">Trek Management</h4>
                    <p class="text-muted small mb-3">Sign in to continue</p>
                    <form @submit.prevent="handleLogin">
                        <div class="mb-3">
                            <label class="form-label">User Name</label>
                            <input type="userName" class="form-control" v-model="loginForm.userName" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" v-model="loginForm.password" required />
                        </div>
                        <div v-if="loginError" class="alert alert-danger py-2 small">{{ loginError }}</div>
                        <button type="submit" class="btn btn-primary w-100" :disabled="loading">
                            <span v-if="loading" class="spinner-border spinner-border-sm me-1"></span>
                            Log In
                        </button>
                    </form>
                    <p class="text-muted small mt-3 mb-0">
                        Don't have an account?
                        <a href="#" @click.prevent="showRegister = true; clearMessages()">Register</a>
                    </p>
                </div>
